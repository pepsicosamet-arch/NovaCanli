name: Windows Setup.exe

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Paketleri kur
        run: |
          npm install --save-dev electron@latest electron-builder@latest
          npm install --save ffmpeg-static@latest

      - name: Setup.exe oluştur
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Derleme çıktısını sakla
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Canli-Setup
          path: dist/*.exe

      - name: GitHub Release'e yükle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          body_path: RELEASE_NOTES.md
