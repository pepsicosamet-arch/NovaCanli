<!doctype html><html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#07080d;font-family:"Inter Display",Inter,sans-serif;color:#fff}
#root{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
.grad{background:linear-gradient(100deg,#ff2d4b,#ff5ea8 45%,#7b3cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.bg{position:absolute;inset:0;background:radial-gradient(1200px 700px at 30% 20%,#2a0f3d 0%,transparent 60%),radial-gradient(1000px 700px at 80% 90%,#0b1d4d 0%,transparent 60%),#07080d}
.grid{position:absolute;inset:-200px;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:80px 80px}
.chip{position:absolute;padding:22px 44px;border-radius:999px;font-weight:800;font-size:54px;background:#151826;border:2px solid #2b3150}
.card{position:absolute;width:520px;height:190px;border-radius:26px;background:linear-gradient(160deg,#171b2b,#10131d);border:2px solid #262c43;padding:34px 38px}
.card b{display:block;font-size:40px;font-weight:800;margin-bottom:10px}
.card span{font-size:27px;color:#9aa3bd}
.card i{position:absolute;right:30px;top:30px;width:16px;height:16px;border-radius:50%;background:#ff2d4b;box-shadow:0 0 20px #ff2d4b}
.shot{position:absolute;border-radius:22px;overflow:hidden;box-shadow:0 40px 120px #000c,0 0 0 2px #2a3150}
.shot img{display:block;width:100%;height:100%;object-fit:cover}
.cap{position:absolute;left:120px;bottom:110px;font-weight:900;font-size:86px;letter-spacing:-1px;line-height:1}
.sub{position:absolute;left:124px;bottom:62px;font-size:34px;color:#c3c9dc;font-weight:500}
.live{display:inline-flex;align-items:center;gap:14px;padding:10px 24px;border-radius:12px;background:#ff2d4b;font-weight:900;font-size:34px;letter-spacing:2px}
.live:before{content:"";width:16px;height:16px;border-radius:50%;background:#fff}
</style></head>
<body><div id="root"></div>
<script>
const root = document.getElementById('root');
const scene = new URLSearchParams(location.search).get('s');
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const E = (t) => 1 - Math.pow(1 - cl(t), 3);            // easeOutCubic
const EB = (t) => { t = cl(t); const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }; // easeOutBack
const seg = (t, a, d) => cl((t - a) / d);
function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
function set(e, o) { Object.assign(e.style, o); }

const S = {};

// 1) Açılış: logo + isim + slogan (5 sn)
S.intro = () => {
  root.append(el('<div class="bg"></div>'), el('<div class="grid" id="g"></div>'));
  const ring = el('<div class="abs" style="left:960px;top:430px;width:10px;height:10px;border-radius:50%;border:4px solid #ff2d4b;transform:translate(-50%,-50%)"></div>');
  const logo = el('<img class="abs" src="nova-icon.png" style="left:960px;top:430px;width:260px;height:260px;transform:translate(-50%,-50%)">');
  const name = el('<div class="abs" style="left:0;right:0;top:600px;text-align:center;font-weight:900;font-size:150px;letter-spacing:-3px">NOVA <span class="grad">Canlı</span></div>');
  const tag = el('<div class="abs" style="left:0;right:0;top:800px;text-align:center;font-size:44px;color:#c3c9dc;font-weight:500">Profesyonel canlı yayın stüdyosu. Bilgisayarında. Ücretsiz.</div>');
  const live = el('<div class="abs" style="left:1265px;top:260px"><span class="live">CANLI</span></div>');
  root.append(ring, logo, name, tag, live);
  return (t) => {
    set(document.getElementById('g'), { transform: `translateY(${-t * 30}px)` });
    const r = E(seg(t, 0.2, 1.2));
    set(ring, { width: `${10 + r * 900}px`, height: `${10 + r * 900}px`, opacity: 1 - r });
    const l = EB(seg(t, 0.3, 0.8));
    set(logo, { transform: `translate(-50%,-50%) scale(${l}) rotate(${(1 - l) * -40}deg)`, opacity: cl(l * 2) });
    const n = E(seg(t, 1.0, 0.8));
    set(name, { opacity: n, transform: `translateY(${(1 - n) * 60}px)`, letterSpacing: `${-3 + (1 - n) * 30}px` });
    const g = E(seg(t, 1.7, 0.8));
    set(tag, { opacity: g, transform: `translateY(${(1 - g) * 30}px)` });
    const lv = EB(seg(t, 2.3, 0.5));
    set(live, { transform: `scale(${lv})`, opacity: cl(lv) * (0.75 + 0.25 * Math.sin(t * 8)) });
    const out = seg(t, 4.6, 0.4);
    set(root, { opacity: 1 - out * 0.0, filter: `brightness(${1 + out * 2})` });
  };
};

// 2) Kinetik kelimeler (4 sn)
S.words = () => {
  root.append(el('<div class="bg"></div>'));
  const W = ['KAMERA.', 'EKRAN.', 'OYUN.', 'GRAFİK.'];
  const subs = ['Webcam • Yakalama kartı', 'Ekran & pencere yakalama', 'Oyun sesiyle birlikte', 'Alt bant • Skor • Kayan yazı'];
  const word = el('<div class="abs" style="left:0;right:0;top:330px;text-align:center;font-weight:900;font-size:260px;letter-spacing:-8px"></div>');
  const sub = el('<div class="abs" style="left:0;right:0;top:660px;text-align:center;font-size:48px;color:#c3c9dc;font-weight:600"></div>');
  const bar = el('<div class="abs" style="left:0;top:0;height:12px;background:linear-gradient(90deg,#ff2d4b,#7b3cff)"></div>');
  root.append(word, sub, bar);
  return (t) => {
    const i = Math.min(3, Math.floor(t));
    const lt = t - i;
    word.textContent = W[i]; sub.textContent = subs[i];
    word.className = 'abs' + (i % 2 ? ' grad' : '');
    const k = E(lt / 0.35);
    set(word, { transform: `scale(${1.4 - 0.4 * k})`, opacity: k, filter: `blur(${(1 - k) * 12}px)` });
    set(sub, { opacity: E((lt - 0.15) / 0.3), transform: `translateY(${(1 - E((lt - 0.15) / 0.3)) * 20}px)` });
    set(bar, { width: `${(t / 4) * 1920}px` });
  };
};

// 3) Arayüz tanıtımı: ekran görüntüsü yakınlaşma + etiketler (6 sn)
S.ui = () => {
  root.append(el('<div class="bg"></div>'));
  const shot = el('<div class="shot" style="left:200px;top:170px;width:1520px;height:855px;transform-origin:50% 0%"><img src="cap/ui_b.jpg"></div>');
  const t1 = el('<div class="abs" style="left:80px;top:40px;font-weight:900;font-size:64px">vMix tarzı <span class="grad">profesyonel arayüz</span></div>');
  const tagA = el('<div class="abs" style="font-weight:800;font-size:30px;padding:10px 20px;border-radius:10px;background:#19c37d">ÖNİZLEME</div>');
  const tagB = el('<div class="abs" style="font-weight:800;font-size:30px;padding:10px 20px;border-radius:10px;background:#ff2d4b">PROGRAM • CANLI</div>');
  root.append(shot, t1, tagA, tagB);
  return (t) => {
    const a = E(seg(t, 0, 0.8));
    const z = 1 + t * 0.035;
    set(shot, { opacity: a, transform: `translateY(${(1 - a) * 80}px) scale(${z})` });
    set(t1, { opacity: E(seg(t, 0.3, 0.6)), transform: `translateX(${(1 - E(seg(t, 0.3, 0.6))) * -60}px)` });
    const ka = EB(seg(t, 1.4, 0.5)), kb = EB(seg(t, 2.0, 0.5));
    set(tagA, { left: '300px', top: '250px', transform: `scale(${ka})`, opacity: cl(ka) });
    set(tagB, { left: '1240px', top: '250px', transform: `scale(${kb})`, opacity: cl(kb) });
  };
};

// 7) Özellik ekranları montajı (6 sn, 3 x 2 sn)
S.montage = () => {
  root.append(el('<div class="bg"></div>'));
  const items = [['cap/ui_templates.jpg', '9 hazır grafik şablonu', 'Alt bant, skor, saat, geri sayım, sosyal medya'],
                 ['cap/ui_replay.jpg', 'Anlık tekrar', 'Son anları yakala, 0.25x yavaş çekimle yayına al'],
                 ['cap/ui_settings.jpg', 'Çoklu platform yayını', 'Tek tıkla birden fazla platforma aynı anda']];
  const nodes = items.map(([src, a, b]) => {
    const s = el(`<div class="shot" style="left:560px;top:150px;width:1280px;height:720px"><img src="${src}" style="object-fit:cover;transform:scale(1.62);transform-origin:50% 52%"></div>`);
    const c1 = el(`<div class="abs" style="left:90px;top:330px;width:440px;font-weight:900;font-size:72px;line-height:1.02">${a}</div>`);
    const c2 = el(`<div class="abs" style="left:94px;top:560px;width:420px;font-size:32px;color:#c3c9dc;line-height:1.3">${b}</div>`);
    root.append(s, c1, c2); return [s, c1, c2];
  });
  return (t) => {
    nodes.forEach(([s, c1, c2], i) => {
      const lt = t - i * 2, on = lt >= 0 && lt < 2;
      const k = E(lt / 0.45);
      set(s, { display: on ? 'block' : 'none', transform: `translateX(${(1 - k) * 300}px) scale(${1.02 + lt * 0.02})`, opacity: k });
      set(c1, { display: on ? 'block' : 'none', opacity: E((lt - 0.1) / 0.35), transform: `translateY(${(1 - E((lt - 0.1) / 0.35)) * 40}px)` });
      set(c2, { display: on ? 'block' : 'none', opacity: E((lt - 0.25) / 0.35) });
      c1.className = 'abs' + (i === 1 ? ' grad' : '');
    });
  };
};

// 8) Platformlar (4 sn)
S.platforms = () => {
  root.append(el('<div class="bg"></div>'), el('<div class="grid"></div>'));
  const P = [['YouTube', 260, 250], ['Twitch', 1250, 230], ['Kick', 180, 640], ['Facebook', 1300, 650], ['TikTok', 760, 820]];
  const chips = P.map(([n, x, y]) => { const c = el(`<div class="chip" style="left:${x}px;top:${y}px">${n}</div>`); root.append(c); return [c, x, y]; });
  const center = el('<div class="abs" style="left:0;right:0;top:420px;text-align:center;font-weight:900;font-size:120px;letter-spacing:-3px;line-height:1">Hepsine <span class="grad">aynı anda</span></div>');
  const sub = el('<div class="abs" style="left:0;right:0;top:570px;text-align:center;font-size:40px;color:#c3c9dc">RTMP / RTMPS çoklu yayın • NVENC • QuickSync • AMF</div>');
  root.append(center, sub);
  return (t) => {
    chips.forEach(([c], i) => {
      const k = EB(seg(t, 0.1 + i * 0.18, 0.5));
      set(c, { transform: `scale(${k}) translateY(${Math.sin(t * 2 + i) * 8}px)`, opacity: cl(k), borderColor: t > 1.6 ? '#ff2d4b' : '#2b3150', boxShadow: t > 1.6 ? '0 0 40px #ff2d4b55' : 'none' });
    });
    const k = E(seg(t, 1.2, 0.6));
    set(center, { opacity: k, transform: `scale(${0.85 + 0.15 * k})` });
    set(sub, { opacity: E(seg(t, 1.7, 0.5)) });
  };
};

// 9) Özellik ızgarası (5 sn)
S.features = () => {
  root.append(el('<div class="bg"></div>'));
  const F = [['8 Geçiş Efekti', 'Fade, silme, daire, yakınlaş…'], ['Yeşil Perde', 'GPU ile chroma key'], ['Ses Mikseri', 'VU metre • AFV • kompresör'],
             ['Kayıt', 'MP4 / MKV, yayınla birlikte'], ['Oynatma Listesi', 'Videolar art arda'], ['Dikey 9:16', 'TikTok & Reels çıkışı']];
  const title = el('<div class="abs" style="left:0;right:0;top:90px;text-align:center;font-weight:900;font-size:86px;letter-spacing:-2px">Yayın için gereken <span class="grad">her şey</span></div>');
  root.append(title);
  const cards = F.map(([a, b], i) => {
    const x = 150 + (i % 3) * 560, y = 330 + Math.floor(i / 3) * 250;
    const c = el(`<div class="card" style="left:${x}px;top:${y}px"><i></i><b>${a}</b><span>${b}</span></div>`); root.append(c); return c;
  });
  return (t) => {
    const k = E(seg(t, 0, 0.5)); set(title, { opacity: k, transform: `translateY(${(1 - k) * -40}px)` });
    cards.forEach((c, i) => { const q = EB(seg(t, 0.35 + i * 0.12, 0.5)); set(c, { opacity: cl(q), transform: `translateY(${(1 - q) * 80}px)` }); });
  };
};

// 10) Kapanış / çağrı (6 sn)
S.cta = () => {
  root.append(el('<div class="bg"></div>'), el('<div class="grid" id="g"></div>'));
  const logo = el('<img class="abs" src="nova-icon.png" style="left:960px;top:300px;width:220px;height:220px;transform:translate(-50%,-50%)">');
  const name = el('<div class="abs" style="left:0;right:0;top:440px;text-align:center;font-weight:900;font-size:130px;letter-spacing:-3px">NOVA <span class="grad">Canlı</span></div>');
  const dl = el('<div class="abs" style="left:50%;top:640px;transform:translateX(-50%);padding:26px 56px;border-radius:20px;background:linear-gradient(100deg,#ff2d4b,#7b3cff);font-weight:900;font-size:50px;white-space:nowrap">Ücretsiz indir • Windows</div>');
  const url = el('<div class="abs" style="left:0;right:0;top:800px;text-align:center;font-size:42px;font-weight:600;color:#e6e9f2">github.com/pepsicosamet-arch/NovaCanli</div>');
  const by = el('<div class="abs" style="left:0;right:0;top:880px;text-align:center;font-size:34px;color:#9aa3bd">Geliştirici: Samet Şahin • @xsametsahinx</div>');
  root.append(logo, name, dl, url, by);
  return (t) => {
    set(document.getElementById('g'), { transform: `translateY(${-t * 25}px)` });
    const l = EB(seg(t, 0.1, 0.7)); set(logo, { transform: `translate(-50%,-50%) scale(${l})`, opacity: cl(l) });
    const n = E(seg(t, 0.5, 0.6)); set(name, { opacity: n, transform: `translateY(${(1 - n) * 40}px)` });
    const d = EB(seg(t, 1.0, 0.6)); set(dl, { opacity: cl(d), transform: `translateX(-50%) scale(${d * (1 + 0.025 * Math.sin(t * 5))})` });
    set(url, { opacity: E(seg(t, 1.5, 0.6)) }); set(by, { opacity: E(seg(t, 1.9, 0.6)) });
    set(root, { opacity: 1 - seg(t, 5.2, 0.8) });
  };
};

// Görüntü sahneleri için arka plan ve üst başlık
S.plain = () => { root.append(el('<div class="bg"></div>'), el('<div class="grid"></div>')); return () => { }; };
S.title2 = () => {
  document.body.style.background = 'transparent'; document.documentElement.style.background = 'transparent';
  const q = new URLSearchParams(location.search);
  root.append(el(`<div class="abs" style="left:160px;top:34px;display:flex;align-items:baseline;gap:30px;white-space:nowrap">
    <div style="font-weight:900;font-size:76px;letter-spacing:-2px" class="grad">${q.get('a')}</div>
    <div style="font-size:34px;color:#c3c9dc;font-weight:600">${q.get('b')}</div></div>`));
  root.append(el('<div class="abs" style="right:160px;top:52px"><span class="live">CANLI</span></div>'));
  return () => { };
};
// Görüntü üstü başlık (şeffaf PNG için)
S.caption = () => {
  document.body.style.background = 'transparent'; document.documentElement.style.background = 'transparent';
  const q = new URLSearchParams(location.search);
  const box = el(`<div class="abs" style="left:50%;top:40px;transform:translateX(-50%);display:flex;align-items:center;gap:22px;padding:20px 40px 20px 26px;border-radius:20px;background:rgba(9,11,18,0.82);border:2px solid #2a3150;white-space:nowrap">
     <img src="nova-icon.png" style="width:64px;height:64px"><div><div style="font-weight:900;font-size:52px;line-height:1">${q.get('a')}</div><div style="font-size:28px;color:#c3c9dc;margin-top:6px">${q.get('b')}</div></div></div>`);
  root.append(box);
  return () => { };
};

window.render = S[scene] ? S[scene]() : () => { };
render(0);
</script></body></html>
